<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Model Picks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: sport rail on the left, field-green banner, one dense matchup board grouped by game */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --fg:#17201a; --muted:#5f6b62; --line:#d9dfd6; --head:#e8ede5;
  --turf:#1f6b3a; --turf-2:#2f8a4c; --on-turf:#ffffff;
  --pick-bg:#c9f07a; --pick-fg:#1b3a07;
  --q1:#38761d; --q2:#d9ead3; --q3:#fff2cc; --q4:#f4cccc; --q5:#cc0000; --q-ink:#1a1a1a;
  --freeze-shadow:rgba(20,40,25,.18); --divider:#a9b5a6; --qna:#d9d9d9;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101512; --surface:#171e19; --fg:#e6ece6; --muted:#9aa79d; --line:#2a342d; --head:#1e2721;
  --turf:#2c8a4c; --turf-2:#3aa25d; --pick-bg:#9fd14a; --pick-fg:#132a04; --freeze-shadow:rgba(0,0,0,.5); --divider:#4a5a4e; --qna:#3a413c; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px}
.banner{color:var(--on-turf);padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:repeating-linear-gradient(90deg,transparent 0 79px,rgba(255,255,255,.12) 79px 81px),linear-gradient(100deg,var(--turf),var(--turf-2) 60%,var(--turf))}
.banner h1{font-family:var(--display);font-weight:700;font-size:2.4rem;letter-spacing:.01em;margin:0;line-height:1}
.banner p{margin:4px 0 0;opacity:.85;font-size:.85rem}
.shell{display:grid;grid-template-columns:120px minmax(0,1fr);min-height:60vh}
.rail{background:var(--head);border-right:1px solid var(--line);padding-block:12px;display:flex;flex-direction:column;gap:2px}
.rail span,.rail a{padding:10px 14px;font-family:var(--display);font-weight:600;font-size:1.05rem;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center;color:var(--muted);text-decoration:none}
.rail a{color:var(--fg)}
.rail a:hover{background:var(--surface)}
.rail a:focus-visible{outline:2px solid var(--turf);outline-offset:-2px}
.rail a.on{background:var(--surface);color:var(--turf);border-left:3px solid var(--turf);padding-left:11px}
.rail small{font-family:var(--body);font-size:.65rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;opacity:.8}
main{min-width:0;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;gap:22px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs a,.tabs span{padding:6px 0 8px;font-weight:600;color:var(--muted);font-size:.9rem;text-decoration:none}
.tabs a:hover{color:var(--fg)}
.tabs a:focus-visible{outline:2px solid var(--turf);outline-offset:2px}
.tabs a.on{color:var(--fg);border-bottom:2px solid var(--turf);margin-bottom:-1px}
.tabs span em{font-style:normal;font-weight:500;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;margin-left:5px;opacity:.7}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.spacer{flex:1}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
label.tog{display:flex;gap:6px;align-items:center;font-size:.85rem;cursor:pointer}
label.tog input:focus-visible{outline:2px solid var(--turf);outline-offset:2px}
.stamp{font-size:.75rem;color:var(--muted)}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:14px 16px;max-width:60ch}
.notice h2{font-family:var(--display);font-size:1.25rem;margin:0 0 4px}
.notice p{margin:0;line-height:1.5;color:var(--muted)}
.board{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:980px;font-variant-numeric:tabular-nums}
.fz{position:sticky;z-index:1;background:var(--surface)}
th.fz{background:var(--head);z-index:2}
.fz0{left:0;width:96px;min-width:96px}
.fz1{left:96px;width:150px;min-width:150px}
.fz2{left:246px;width:72px;min-width:72px}
.fz3{left:318px;width:96px;min-width:96px;box-shadow:inset -1px 0 0 var(--line),6px 0 6px -4px var(--freeze-shadow)}
thead tr.grp th.fz{left:0}
td.q1,td.q2,td.q3,td.q4,td.q5{color:var(--q-ink)}
td.q1{background:var(--q1)} td.q2{background:var(--q2)} td.q3{background:var(--q3)} td.q4{background:var(--q4)} td.q5{background:var(--q5)}
td.gap,th.gap{border-left:4px solid var(--surface)}
th{font-family:var(--display);font-weight:600;font-size:.9rem;letter-spacing:.03em;color:var(--muted);background:var(--head);padding:6px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th.l,td.l{text-align:left}
th.c,td.c{text-align:center}
thead tr.grp th{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;padding-bottom:0;border-bottom:0;text-align:center}
thead tr.grp th.ul{border-bottom:2px solid var(--turf)}
td{padding:5px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
tbody.g tr:first-child td{border-bottom-style:dotted}
tbody.g tr:last-child td{border-bottom:3px solid var(--divider)}
tbody.g:last-child tr:last-child td{border-bottom:0}
td.time{font-size:.78rem;color:var(--muted);text-align:left;vertical-align:middle;border-right:1px solid var(--line);line-height:1.35}
td.team{font-weight:600}
td.team .ha{font-size:.65rem;font-weight:500;color:var(--muted);margin-left:5px;letter-spacing:.05em}
td.gm{vertical-align:middle;border-left:1px solid var(--line)}
td.sepL{border-left:1px solid var(--line)}
td.na{color:var(--muted)}
.chip{display:inline-block;background:var(--pick-bg);color:var(--pick-fg);font-weight:700;padding:3px 9px;border-radius:4px;font-family:var(--display);font-size:1rem;letter-spacing:.02em}
.none{color:var(--muted);font-size:.85rem}
tbody.g.picked td.time{box-shadow:inset 3px 0 0 var(--pick-bg)}
td.delta{vertical-align:middle}
td.delta b{font-family:var(--display);font-size:1.1rem}
.view{display:flex;flex-direction:column;gap:14px;min-width:0}
body.noqb .qbc{display:none}
/* Division Rank */
.divwrap{display:flex;flex-direction:column;gap:22px}
.conf h2{font-family:var(--display);font-weight:700;font-size:1.7rem;margin:0 0 10px;line-height:1}
.conf{display:flex;flex-direction:column;gap:14px}
table.dv{table-layout:fixed;width:1030px;min-width:0}
table.dv th.dname{font-size:1.05rem;color:var(--fg);text-align:left}
.divwrap .board{width:fit-content;max-width:100%}
table.dv .pb{left:0}
table.dv td.team{color:var(--turf)}
table.dv tbody tr:last-child td{border-bottom:0}
/* Power Rankings */
table.pr{min-width:640px}
table.pr.wide{min-width:0;width:auto}
table.pr tbody tr:nth-child(4n) td{border-bottom-color:var(--divider)}
.pa{position:sticky;left:0;width:40px;min-width:40px;z-index:1;background:var(--surface);color:var(--muted);text-align:right}
.pb{position:sticky;left:40px;width:150px;min-width:150px;z-index:1;background:var(--surface);box-shadow:inset -1px 0 0 var(--line),6px 0 6px -4px var(--freeze-shadow)}
th.pa,th.pb{background:var(--head);z-index:2}
td.qna{background:var(--qna);color:var(--muted)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover,th.sorted{color:var(--fg)}
th.sortable:focus-visible{outline:2px solid var(--turf);outline-offset:-2px}
th .arrow{font-size:.7em;margin-left:3px}
td.v{color:var(--muted)}
th.sub{font-family:var(--body);font-size:.68rem;font-weight:500;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
th.st{text-align:center;border-left:1px solid var(--line);border-bottom:0;padding-bottom:0}
th.grp2{text-align:center;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;border-left:4px solid var(--surface);border-bottom:2px solid var(--turf)}
td.sl,th.sl{border-left:1px solid var(--line)}
td.gl,th.gl{border-left:4px solid var(--surface)}
@media (max-width:640px){
  .shell{grid-template-columns:1fr}
  .rail{flex-direction:row;overflow-x:auto;padding:0;border-right:0;border-bottom:1px solid var(--line)}
  .rail span,.rail a{gap:6px}
  .rail a.on{border-left:0;border-bottom:3px solid var(--turf);padding-left:14px}
  .banner h1{font-size:2rem}
  .fz0,.fz2,.fz3,thead tr.grp th.fz{position:static;box-shadow:none}
  .fz1{left:0;box-shadow:inset -1px 0 0 var(--line),6px 0 6px -4px var(--freeze-shadow)}
}
</style>
</head>
<body>
<header class="banner">
  <h1>Model Picks</h1>
  <p>Lines, model picks and team ranks</p>
</header>

<div class="shell">
  <nav class="rail" aria-label="Sports">
    <a href="#nfl" id="sport-nfl" class="on" aria-current="page">NFL</a>
    <a href="#cfb" id="sport-cfb">CFB</a>
    <span>NBA <small>Soon</small></span>
    <a href="#cbb" id="sport-cbb">CBB</a>
    <span>MLB <small>Soon</small></span>
  </nav>

  <main>
    <nav class="tabs" aria-label="Views">
      <a href="#nfl" id="tabMatchup" class="on">Match-up</a>
      <a href="#nfl-rankings" id="tabRankings">Power Rankings</a>
      <a href="#nfl-division" id="tabDivision">Division Rank</a>
    </nav>

    <div id="msg" class="notice" hidden></div>

    <section class="view" id="viewDivision" hidden>
      <div class="bar"><div class="spacer"></div><span class="stamp"></span></div>
      <div id="divWrap" class="divwrap"></div>
    </section>

    <section class="view" id="viewRankings" hidden>
      <div class="bar">
        <div class="spacer"></div>
        <div class="ctl">
          <label class="tog"><input type="checkbox" id="expand"> Expanded details</label>
          <span class="stamp"></span>
        </div>
      </div>
      <div class="board"><table class="pr" id="prTable"></table></div>
    </section>

    <section class="view" id="viewMatchup">
    <div class="bar">
      <div class="stat"><b id="sGames">–</b><span>Games</span></div>
      <div class="stat"><b id="sPicks">–</b><span>Model picks</span></div>
      <div class="stat"><b id="sEdge">–</b><span>Biggest edge</span></div>
      <div class="spacer"></div>
      <div class="ctl">
        <label class="tog"><input type="checkbox" id="picksOnly"> Picks only</label>
        <span class="stamp"></span>
      </div>
    </div>

    <div class="board">
      <table id="muTable">
        <thead>
          <tr class="grp">
            <th colspan="4" class="fz"></th>
            <th></th>
            <th colspan="3" class="ul">Model</th>
            <th colspan="2"></th><th class="qbc"></th><th class="qbc"></th>
            <th class="ul">Offense</th>
            <th class="ul">Defense</th>
            <th></th>
          </tr>
          <tr>
            <th class="l fz fz0">Kickoff</th>
            <th class="l fz fz1">Team</th>
            <th class="fz fz2">Spread</th>
            <th class="fz fz3">Money line</th>
            <th>Total</th>
            <th class="c">Pick</th>
            <th>Line</th>
            <th>Δ</th>
            <th class="c">Record</th>
            <th>Model rank</th>
            <th class="gap qbc">QBR</th>
            <th class="l qbc">QB</th>
            <th class="c">Rank</th>
            <th class="c">Rank</th>
            <th class="c">SoS</th>
          </tr>
        </thead>
      </table>
    </div>
    </section>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
let data = null;

function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function signed(n){ return n == null ? "–" : n > 0 ? "+" + n : String(n); }
// Quintile of a rank among this sport's teams (32 in the NFL, about 138 in FBS)
function q(n){ return n == null || n < 1 ? "" : "q" + Math.min(5, Math.ceil(n / ((data?.teamCount || 32) / 5))); }
function cell(v, cls){ return `<td class="${cls || ""}${v == null ? " na" : ""}">${esc(v ?? "–")}</td>`; }
function kickoff(iso){
  const d = new Date(iso);
  const day = d.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"});
  const time = d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit", timeZoneName:"short"});
  return `${esc(time)}<br>${esc(day)}`;
}
function lineText(g){
  if (g.line == null) return "–";
  const l = Math.round(g.line * 10) / 10;
  if (l === 0) return "PK";
  return l < 0 ? `${g.home.name} ${l.toFixed(1)}` : `${g.away.name} −${l.toFixed(1)}`;
}

function render(){
  const stamp = "Updated " + new Date(data.generatedAt).toLocaleString([], {weekday:"short", hour:"numeric", minute:"2-digit"});
  document.querySelectorAll(".stamp").forEach(s => s.textContent = stamp);
  document.body.classList.toggle("noqb", data.hasQbr === false);
  renderMatchup();
  renderRankings();
  renderDivisions();
}

// ---------- Division Rank ----------
function renderDivisions(){
  const divs = data.divisions || [];
  const wrap = $("divWrap");
  if (!divs.length){ wrap.innerHTML = `<p class="none">Standings aren't available yet. They appear after the next update run.</p>`; return; }
  const odds = v => v == null ? null : (/^[+-]/.test(v) ? v : (Number(v) > 0 ? "+" + v : v));
  const rem = divs.some(d => d.teams.some(t => t.remSosRank != null));
  const qb = data.hasQbr !== false;
  const width = 1030 + (rem ? 90 : 0) - (qb ? 0 : 220);
  const table = d => `<div class="board"><table class="dv" style="width:${width}px">
    <colgroup><col style="width:160px"><col style="width:110px"><col style="width:90px"><col style="width:90px">
      <col style="width:100px">${qb ? `<col style="width:70px"><col style="width:150px">` : ""}<col style="width:90px"><col style="width:90px"><col style="width:80px">${rem ? `<col style="width:90px">` : ""}</colgroup>
    <thead>
      <tr><th class="dname pb l" rowspan="2">${esc(d.name)}</th>
        <th class="c" rowspan="2">Overall W-L</th><th class="c" rowspan="2">${esc(data.groupRecordLabel || "Div W-L")}</th><th class="c" rowspan="2">Odds</th>
        <th class="c gl" rowspan="2">Model rank</th>${qb ? `<th class="c gl" rowspan="2">QBR</th><th class="l" rowspan="2">QB</th>` : ""}
        <th class="c off gl">Offense</th><th class="c def gl">Defense</th><th class="c gl" rowspan="2" title="Strength of schedule rank (1 = hardest)">SoS</th>${rem ? `<th class="c gl" rowspan="2" title="Remaining strength of schedule rank (1 = hardest)">Rem SoS</th>` : ""}</tr>
      <tr><th class="c off gl sub">Rank</th><th class="c def gl sub">Rank</th></tr>
    </thead>
    <tbody>${d.teams.map(t => `<tr>
      <td class="pb team l">${esc(t.name)}</td>
      ${cell(t.overall, "c")}
      ${cell(t.divRecord, "c")}
      ${cell(odds(t.odds), "c")}
      ${cell(t.modelRank, "c gl " + q(t.modelRank))}
      ${qb ? qbrCell(t, "gl") : ""}
      ${qb ? cell(t.qb, "l") : ""}
      ${cell(t.offYppRank, "c gl " + q(t.offYppRank))}
      ${cell(t.defYppRank, "c gl " + q(t.defYppRank))}
      ${cell(t.sosRank, "c gl " + q(t.sosRank))}
      ${rem ? cell(t.remSosRank, "c gl " + q(t.remSosRank)) : ""}</tr>`).join("")}</tbody>
  </table></div>`;
  wrap.innerHTML = [...new Set(divs.map(d => d.conference))].map(c => {
    const list = divs.filter(d => d.conference === c);
    return list.length ? `<section class="conf"><h2>${c} Standings</h2>${list.map(table).join("")}</section>` : "";
  }).join("");
}

// ---------- Power Rankings ----------
// Expanded columns follow the sheet's Power Rankings tab, columns D through CU.
// a = show the average; x = an extra per-attempt / per-play column [key, label]; rankOnly / text for special cells.
const EXPANDED = [
  {g:"Total", cols:[{h:"Off yds / gm", k:"yardsPerGame"}, {h:"Def yds / gm", k:"oppYardsPerGame"}]},
  {g:"Per play", cols:[{h:"Off yds / play", k:"yardsPerPlay"}, {h:"Def yds / play", k:"oppYardsPerPlay"}]},
  {g:"Offense summary", cols:[{h:"Yds / point", k:"yardsPerPoint"}, {h:"Pass yds", k:"passYds", x:["passYdsPerAtt","/ att"]}, {h:"Rush yds", k:"rushYds", x:["rushYdsPerAtt","/ att"]}]},
  {g:"Defense summary", cols:[{h:"Yds / point", k:"oppYardsPerPoint"}, {h:"Pass yds", k:"oppPassYds", x:["oppPassYdsPerAtt","/ att"]}, {h:"Rush yds", k:"oppRushYds", x:["oppRushYdsPerAtt","/ att"]}]},
  {g:"Offense", cols:[{h:"Third down %", k:"thirdDown"}, {h:"Red zone %", k:"redZone"}, {h:"Red zone att", k:"redZoneAtt", x:["redZoneAttPerPlay","/ play"]},
    {h:"Comp %", k:"completion"}, {h:"Interceptions", k:"intThrown", x:["intThrownPerAtt","/ att"]}, {h:"Fumbles", k:"fumblesLost"}, {h:"QB sacked", k:"qbSacked"}, {h:"Time of poss", k:"timeOfPoss"}]},
  {g:"Defense", cols:[{h:"Third down %", k:"oppThirdDown"}, {h:"Red zone %", k:"oppRedZone"}, {h:"Red zone att", k:"oppRedZoneAtt", x:["oppRedZoneAttPerPlay","/ play"]},
    {h:"Comp %", k:"oppCompletion"}, {h:"Interceptions", k:"interceptions", x:["interceptionsPerAtt","/ att"]}, {h:"Fumbles", k:"oppFumblesLost"}, {h:"Sack %", k:"sackPct"}]},
  {g:"Other", cols:[{h:"Penalties", k:"penaltyYards"}, {h:"Opp penalties", k:"oppPenaltyYards"}, {h:"FG %", k:"fgPct"}, {h:"SoS", k:"sos", rankOnly:true}, {h:"QBR", k:"qbr", rankOnly:true}, {h:"QB", text:"qb"}]},
];
// College basketball: the Coll Bball Power Rankings columns plus shooting detail
const EXPANDED_CBB = [
  {g:"Scoring", cols:[{h:"Off PPG", k:"ppg"}, {h:"Def PPG", k:"oppPpg"}, {h:"Avg margin", k:"margin"}]},
  {g:"Efficiency", cols:[{h:"Off eff", k:"offEff"}, {h:"Def eff", k:"defEff"}, {h:"Possessions", k:"possPg"}]},
  {g:"Shooting", cols:[{h:"FG %", k:"fgPct"}, {h:"Opp FG %", k:"oppFgPct"}, {h:"3 Pt %", k:"threePct"}, {h:"Opp 3 Pt %", k:"oppThreePct"}, {h:"FT %", k:"ftPct"}]},
  {g:"Possession", cols:[{h:"Reb %", k:"rebPct"}, {h:"Turnover %", k:"tovPct"}, {h:"Forced TO %", k:"forcedTov"}]},
  {g:"Schedule", cols:[{h:"SoS", k:"sos", rankOnly:true}, {h:"Rem SoS", k:"remSos", rankOnly:true}]},
];

// QBR: a team with no qualified passer shows the model's placeholder rank on a grey cell.
function qbrMissing(t){ return t.qbrAssumed || t.qbr == null; }
function qbrVal(t){ return qbrMissing(t) ? (data.settings?.qbrMissingRank ?? 25) : t.qbr; }
function qbrCell(t, extra){
  if (!qbrMissing(t)) return cell(t.qbr, `c ${extra} ${q(t.qbr)}`);
  return `<td class="c qna ${extra}" title="No qualified QB on ESPN's QBR list; the model uses ${qbrVal(t)}">${qbrVal(t)}</td>`;
}

// Sorting: click a header to sort ascending, click again for descending. Blanks always sort last.
let prSort = {id: "modelRank", dir: 1};
function sortValue(v){
  if (v == null || v === "") return null;
  if (typeof v === "number") return v;
  const s = String(v);
  const time = s.match(/^(\d+):(\d+)/);
  if (time) return +time[1] * 60 + +time[2];                      // minutes:seconds
  const rec = s.match(/^(\d+)-(\d+)(?:-(\d+))?$/);
  if (rec) { const w = +rec[1], l = +rec[2], t = +(rec[3] || 0); return -(w + t / 2) / Math.max(1, w + l + t); } // best record first
  const n = parseFloat(s.replace(/[%,]/g, ""));
  return Number.isFinite(n) ? n : s.toLowerCase();
}
function sortTh(id, label, cls, attrs = ""){
  const on = prSort.id === id;
  const arrow = on ? `<span class="arrow" aria-hidden="true">${prSort.dir > 0 ? "▲" : "▼"}</span>` : "";
  return `<th class="${cls} sortable${on ? " sorted" : ""}" data-sort="${id}" tabindex="0" aria-sort="${on ? (prSort.dir > 0 ? "ascending" : "descending") : "none"}" ${attrs}>${label}${arrow}</th>`;
}

function renderRankings(){
  const table = $("prTable");
  const expanded = $("expand").checked;
  const EXP = data.sport === "cbb" ? EXPANDED_CBB : EXPANDED;
  table.classList.toggle("wide", expanded);

  // getters for every sortable column
  const G = {
    pos: t => t.modelRank, team: t => t.name, modelRank: t => t.modelRank, record: t => t.record,
    qbr: qbrVal, qb: t => t.qb, off: t => t.offYppRank, def: t => t.defYppRank,
  };
  if (expanded) for (const grp of EXP) for (const c of grp.cols){
    if (c.text) continue;
    if (c.k !== "qbr") G[c.k + ".r"] = t => t.stats?.[c.k]?.r;
    if (!c.rankOnly) G[c.k + ".v"] = t => t.stats?.[c.k]?.v;
    if (c.x) G[c.x[0] + ".v"] = t => t.stats?.[c.x[0]]?.v;
  }
  if (!G[prSort.id]) prSort = {id: "modelRank", dir: 1};
  const get = G[prSort.id];
  const rows = [...(data.powerRankings || [])].sort((a, b) => {
    const x = sortValue(get(a)), y = sortValue(get(b));
    if (x === y) return a.modelRank - b.modelRank;
    if (x == null) return 1;
    if (y == null) return -1;
    return (x < y ? -1 : 1) * prSort.dir;
  });
  const front = (t, i) => `<td class="pa">${i + 1}</td><td class="pb team l">${esc(t.name)}</td>${cell(t.modelRank, "c " + q(t.modelRank))}${cell(t.record, "c")}`;

  if (!expanded){
    table.innerHTML = `<thead>
      <tr>${sortTh("pos", "#", "pa", 'rowspan="2"')}${sortTh("team", "Team", "pb l", 'rowspan="2"')}
        ${sortTh("modelRank", "Model rank", "c", 'rowspan="2"')}${sortTh("record", "Record", "c", 'rowspan="2"')}
        ${sortTh("qbr", "QBR", "c gl qbc", 'rowspan="2"')}${sortTh("qb", "QB", "l qbc", 'rowspan="2"')}
        <th class="c off gl">Offense</th><th class="c def gl">Defense</th></tr>
      <tr>${sortTh("off", "Rank", "c off gl sub")}${sortTh("def", "Rank", "c def gl sub")}</tr></thead>
      <tbody>${rows.map((t, i) => `<tr>${front(t, i)}
        ${qbrCell(t, "gl qbc")}
        ${cell(t.qb, "l qbc")}
        ${cell(t.offYppRank, "c gl " + q(t.offYppRank))}
        ${cell(t.defYppRank, "c gl " + q(t.defYppRank))}</tr>`).join("")}</tbody>`;
    return;
  }

  const span = c => c.text || c.rankOnly ? 1 : c.x ? 3 : 2;
  let h1 = sortTh("pos", "#", "pa", 'rowspan="3"') + sortTh("team", "Team", "pb l", 'rowspan="3"') +
           sortTh("modelRank", "Model rank", "c", 'rowspan="3"') + sortTh("record", "Record", "c", 'rowspan="3"');
  let h2 = "", h3 = "";
  for (const grp of EXP){
    h1 += `<th class="grp2" colspan="${grp.cols.reduce((n, c) => n + span(c), 0)}">${esc(grp.g)}</th>`;
    grp.cols.forEach((c, i) => {
      const edge = i === 0 ? "gl" : "sl";
      h2 += `<th class="st ${edge}" colspan="${span(c)}">${esc(c.h)}</th>`;
      if (c.text) h3 += sortTh(c.text, "Name", `sub l ${edge}`);
      else if (c.k === "qbr") h3 += sortTh("qbr", "Rank", `sub c ${edge}`);
      else {
        h3 += sortTh(c.k + ".r", "Rank", `sub c ${edge}`);
        if (!c.rankOnly) h3 += sortTh(c.k + ".v", "Avg", "sub");
        if (c.x) h3 += sortTh(c.x[0] + ".v", esc(c.x[1]), "sub");
      }
    });
  }
  const body = rows.map((t, i) => {
    let tds = front(t, i);
    for (const grp of EXP) grp.cols.forEach((c, j) => {
      const edge = j === 0 ? "gl" : "sl";
      if (c.text) { tds += cell(t[c.text], "l " + edge); return; }
      if (c.k === "qbr") { tds += qbrCell(t, edge); return; }
      const s = t.stats?.[c.k] || {};
      tds += cell(s.r, `c ${edge} ${q(s.r)}`);
      if (!c.rankOnly) tds += cell(s.v, "v");
      if (c.x) tds += cell(t.stats?.[c.x[0]]?.v, "v");
    });
    return `<tr>${tds}</tr>`;
  }).join("");
  table.innerHTML = `<thead><tr>${h1}</tr><tr>${h2}</tr><tr>${h3}</tr></thead><tbody>${body}</tbody>`;
}

function onSort(e){
  const th = e.target.closest("th[data-sort]");
  if (!th || (e.type === "keydown" && e.key !== "Enter" && e.key !== " ")) return;
  e.preventDefault();
  const id = th.dataset.sort;
  prSort = prSort.id === id ? {id, dir: -prSort.dir} : {id, dir: 1};
  renderRankings();
  document.querySelector(`#prTable th[data-sort="${CSS.escape(id)}"]`)?.focus();
}
$("prTable").addEventListener("click", onSort);
$("prTable").addEventListener("keydown", onSort);

// ---------- Match-up ----------
function renderMatchup(){
  const games = data.games;
  const only = $("picksOnly").checked;
  const list = only ? games.filter(g => g.pick) : games;
  $("sGames").textContent = games.length;
  $("sPicks").textContent = games.filter(g => g.pick).length;
  const top = games.filter(g => g.pick).sort((a,b) => b.delta - a.delta)[0];
  $("sEdge").textContent = top ? `${top.pick} ${top.delta.toFixed(1)}` : "–";

  const tb = $("muTable");
  tb.querySelectorAll("tbody").forEach(b => b.remove());
  if (!list.length){
    const b = document.createElement("tbody");
    b.innerHTML = `<tr><td colspan="15" class="l none" style="padding:16px">${games.length ? "No model picks this week." : "No games with lines yet this week."}</td></tr>`;
    tb.appendChild(b); return;
  }
  for (const g of list){
    const b = document.createElement("tbody");
    b.className = "g" + (g.pick ? " picked" : "");
    const pickCell = g.pick ? `<span class="chip">${esc(g.pick)}</span>` : `<span class="none">None</span>`;
    const row = (t, i, tag) => `
      ${i === 0 ? `<td class="time fz fz0" rowspan="2">${kickoff(g.kickoff)}</td>` : ""}
      <td class="team l fz fz1">${esc(t.name)}<span class="ha">${tag}</span></td>
      <td class="fz fz2">${esc(signed(t.spread))}</td>
      <td class="fz fz3">${esc(signed(t.ml))}</td>
      ${i === 0 ? `<td class="gm" rowspan="2">${esc(g.total ?? "–")}</td>
        <td class="gm c" rowspan="2">${pickCell}</td>
        <td class="gm" rowspan="2">${esc(lineText(g))}</td>
        <td class="delta" rowspan="2">${g.delta == null ? "–" : `<b>${g.delta.toFixed(1)}</b>`}</td>` : ""}
      ${cell(t.record, "c sepL")}
      ${cell(t.modelRank, "c " + q(t.modelRank))}
      ${qbrCell(t, "gap qbc")}
      ${cell(t.qb, "l qbc")}
      ${cell(t.offYppRank, "c sepL " + q(t.offYppRank))}
      ${cell(t.defYppRank, "c sepL " + q(t.defYppRank))}
      ${cell(t.sosRank, "c sepL " + q(t.sosRank))}`;
    b.innerHTML = `<tr>${row(g.away,0,"AWAY")}</tr><tr>${row(g.home,1,"HOME")}</tr>`;
    tb.appendChild(b);
  }
}

function notice(title, body){
  const m = $("msg"); m.hidden = false;
  m.innerHTML = `<h2>${esc(title)}</h2><p>${esc(body)}</p>`;
}

for (const [id, key] of [["picksOnly", "mp.picksOnly"], ["expand", "mp.expand"]]){
  try { $(id).checked = localStorage.getItem(key) === "1"; } catch {}
  $(id).addEventListener("change", () => {
    try { localStorage.setItem(key, $(id).checked ? "1" : "0"); } catch {}
    if (data) render();
  });
}

// Address: #<sport>[-rankings|-division], e.g. #cfb-rankings. Old links (#rankings, #division) mean NFL.
const SPORTS = ["nfl", "cfb", "cbb"];
const cache = {};
let currentSport = null;

function route(){
  const h = location.hash.replace(/^#/, "");
  const [a, b] = h.split("-");
  const sport = SPORTS.includes(a) ? a : "nfl";
  const sub = SPORTS.includes(a) ? b : a;
  const view = {rankings: "Rankings", division: "Division"}[sub] || "Matchup";
  return {sport, view};
}

function showView(){
  const {sport, view} = route();
  for (const v of ["Matchup", "Rankings", "Division"]){
    $("view" + v).hidden = v !== view;
    $("tab" + v).classList.toggle("on", v === view);
  }
  $("tabMatchup").href = "#" + sport;
  $("tabRankings").href = `#${sport}-rankings`;
  $("tabDivision").href = `#${sport}-division`;
  for (const s of SPORTS){
    const a = $("sport-" + s);
    a.classList.toggle("on", s === sport);
    if (s === sport) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  }
  if (sport !== currentSport) loadSport(sport);
}

function loadSport(sport){
  currentSport = sport;
  $("msg").hidden = true;
  if (cache[sport]) { data = cache[sport]; prSort = {id: "modelRank", dir: 1}; render(); return; }
  fetch(`data/${sport}.json`, {cache: "no-cache"})
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => {
      cache[sport] = d;
      if (currentSport !== sport) return;
      data = d; prSort = {id: "modelRank", dir: 1}; render();
      if (!d.games.length && d.gamesSource === "none") notice("No lines source set", "Add an ODDS_API_KEY secret so the job can load this week's games.");
    })
    .catch(() => { if (currentSport === sport) { data = null; clearTables(); notice("No picks yet", `The update job hasn't produced ${sport.toUpperCase()} data yet. Run the Update picks workflow on GitHub, then reload.`); } });
}

function clearTables(){
  $("muTable").querySelectorAll("tbody").forEach(b => b.remove());
  $("prTable").innerHTML = "";
  $("divWrap").innerHTML = "";
  for (const id of ["sGames", "sPicks", "sEdge"]) $(id).textContent = "–";
  document.querySelectorAll(".stamp").forEach(s => s.textContent = "");
}

window.addEventListener("hashchange", showView);
showView();
</script>
